name: hosted adapter matrix

# Runs the VOA adapter as a real server on hosted Linux against the pinned dataset commit.
# No secrets: the revision is public, so this also proves the reader works anonymously.

on:
  workflow_dispatch:
    inputs:
      pin:
        description: "Titan-Learn commit to pin (40 hex, never a branch)"
        required: true
        default: "0cf163c23c2ee9777c93c9e9c70afceeb837c6a3"
      prefix:
        description: "isolated mount for the trial"
        required: true
        default: "/api/v1/preview/learn/voa"

permissions:
  contents: read

concurrency:
  group: voa-hosted-matrix
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install exactly what the container installs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests psutil

      - name: run the hosted matrix
        run: |
          python hosted_matrix.py --pin "${{ inputs.pin }}" --prefix "${{ inputs.prefix }}" \
            | tee hosted-matrix.log

      - name: fail loudly if the report is missing checks
        run: |
          python - <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path("hosted-matrix.json").read_text(encoding="utf-8"))
          if report.get("failure"):
              sys.exit(f"the matrix aborted: {report['failure']}")
          checks = report["checks"]
          needed = ("health pinned_revision", "mounted prefix", "index declared+ready",
                    "index records_sha256 link", "cold /catalog index_source",
                    "catalog facet sums agree", "pages disjoint", "tail page is the remainder",
                    "GET audio byte-exact vs dataset sha", "audio 206 slice",
                    "audio 416 malformed range", "video 206 head", "JSON 304 on ETag",
                    "after cache damage: rows", "after cache damage: re-downloaded size",
                    "fresh cache (new container): cold_start_seconds reported",
                    "fresh cache (new container): index source",
                    "default mount absent", "401 /items", "401 with a forged bearer")
          missing = [name for name in needed if name not in checks]
          print(f"{len(checks)} checks recorded")
          if missing:
              sys.exit(f"missing checks: {missing}")
          problems = []
          if checks["GET audio byte-exact vs dataset sha"][2] is not True:
              problems.append("served audio bytes did not match the dataset checksum")
          if checks["audio 206 slice"][0] != 206 or checks["audio 206 slice"][3] is not True:
              problems.append("the 206 slice was not the requested bytes")
          if checks["video 206 head"][2] is not True:
              problems.append("the video content-range did not match the object size")
          if checks["after cache damage: re-downloaded size"] is not True:
              problems.append("the damaged cache was not restored to the declared size")
          if checks["after cache damage: rows"] != 71291:
              problems.append("the reader did not recover 71,291 rows after cache damage")
          if checks["cold /catalog index_source"] != "dataset":
              problems.append("rows did not come from the published index")
          if checks["catalog facet sums agree"] is not True:
              problems.append("facets do not add up to the record count")
          if checks["default mount absent"] != 404:
              problems.append("the default mount answered on a preview-only deployment")
          auth = [value for key, value in checks.items() if key.startswith("401 ")]
          if len(auth) < 10 or set(auth) != {401}:
              problems.append(f"expected every content route to answer 401, got {auth}")
          forty_one = [k for k in checks if k.startswith("401 ")]
          if len(forty_one) < 10:
              problems.append(f"only {len(forty_one)} routes were verified as 401")
          if len(checks) < 70:
              problems.append(f"only {len(checks)} checks recorded, expected the full matrix")
          if checks["default mount absent"] != 404:
              problems.append("the default mount answered on a preview-only deployment")
          if checks["tail page is the remainder"][3] is not True:
              problems.append("the last page was not the remainder of the list")
          if problems:
              sys.exit("; ".join(problems))
          print(f"hosted matrix passed: {len(checks)} checks, {len(forty_one)} of them 401 proofs")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voa-hosted-matrix
          path: |
            hosted-matrix.json
            hosted-matrix.log
